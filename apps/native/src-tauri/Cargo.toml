[package]
name = "freddai-native"
version = "1.0.2"
edition = "2021"
publish = false

[lib]
name = "freddai_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = ["unstable", "tray-icon"] }
serde_json = "1"
tauri-plugin-dialog = "2"
sha2 = "0.10"
libc = "0.2"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
# Preview tunnel (src/preview_tunnel.rs): rustls only so iOS/Android builds never need openssl.
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "net", "macros", "sync", "io-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
bytes = "1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
freddai-core = { path = "../../../crates/core" }
scout-core = { path = "../../../crates/scout-core" }
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
portable-pty = "0.9"
tokio = { version = "1", features = ["time", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
notify-rust = "4.18"
fs2 = "0.4"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
subtle = "2"
objc2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebViewConfiguration"] }
# Local push-to-talk dictation (src/voice). macOS only so the iOS build never compiles whisper.cpp.
transcribe-rs = { version = "=0.3.11", default-features = false, features = ["whisper-metal"] }
cpal = "0.15"
# Bug walk global shortcut (src/bug_walk). Desktop only; registered from Rust so no capability entry is needed.
tauri-plugin-global-shortcut = "2"
rubato = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "isomp4", "aac"] }

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-native-shell = { path = "plugins/native-shell" }
tokio = { version = "1", features = ["time"] }

[[test]]
name = "writing_tools_configuration"
harness = false

[[test]]
name = "thread_windows"
harness = false

[[test]]
name = "browser_sessions"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSDate", "NSRunLoop"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView"] }
