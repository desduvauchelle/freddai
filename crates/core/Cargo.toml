[package]
name = "freddai-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
