[package]
name = "freddai-core"
version = "1.0.2"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }
