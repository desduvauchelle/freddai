name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix services/relay
      - run: pnpm typecheck
      - run: node --test apps/web/tests/*.test.mjs services/relay/server.test.mjs
      - run: pnpm --filter @freddai/shared test
      - run: pnpm --filter @freddai/scout test
      - run: pnpm build
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p freddai-core
      - run: cargo test --locked -p scout-core
