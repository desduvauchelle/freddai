name: Package desktop
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/package.yml']
  workflow_dispatch:
    inputs:
      check_windows:
        description: 'Also build Windows installer (host unsupported; validation only)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('apps/native/src-tauri/tauri.conf.json')).version;
          if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Tag must match Tauri version');
          JS
  package:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require macOS distribution credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!key}" || { echo "Missing secret: $key"; exit 1; }
          done
        shell: bash
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: cargo test --workspace
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/native
          args: ${{ matrix.args }}
      - name: Stage installers
        shell: bash
        run: |
          mkdir -p release-assets
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for extension in ('dmg', 'deb', 'AppImage'):
              for path in Path('target').glob(f'**/release/bundle/*/*.{extension}'):
                  name = {'dmg': 'Freddai-macos-universal.dmg', 'deb': 'Freddai-linux-x64.deb', 'AppImage': 'Freddai-linux-x64.AppImage'}[extension]
                  shutil.copy2(path, Path('release-assets') / name)
          if not list(Path('release-assets').iterdir()):
              raise SystemExit('No installers produced')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Create draft after all builds pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state; then
            grep -qx true draft-state || { echo 'Refusing to modify a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Freddai $RELEASE_TAG" --notes 'Packaging complete. Verify installation and platform behavior before publishing.'
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
  windows-validation:
    if: github.event_name == 'push' || inputs.check_windows
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/native
          args: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsupported-validation
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
